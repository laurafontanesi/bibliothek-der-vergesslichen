# Publish the website: on every push to main, the folder web/ (pages, data, pictures, fonts) becomes the
# site at https://laurafontanesi.github.io/bibliothek-der-vergesslichen/. Nothing else of the repository
# is published. Settings > Pages > Source must be "GitHub Actions". Based on GitHub's starter workflow
# "Deploy static content to Pages" (actions/starter-workflows, pages/static.yml).
name: Publish the site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
